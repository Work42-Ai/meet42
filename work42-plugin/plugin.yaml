manifest_version: 2
name: meet42
version: 1.6.0
description: >
  The meeting vertical, extracted from work42 into a first-party plugin
  (meet42-plugin-conversion, M2). Provides the `meeting` workflow (Prepare for
  Meeting -> In Meeting -> Summary -> Done, driven entirely by recording-
  lifecycle storage signals), the `event` session type (its Brief and Recap tabs show the
  `meeting-brief` and `meeting-summary` artifacts as artifact tiles), the event-details /
  recording / annotations / calendar widgets
  (which render over files in the session dir + the standalone `meet42` CLI's
  verbs), the recording widget's active-meeting background agent, the calendar
  widget's mic-open detection + background-session handoff and scheduler reconciler, the `meet42-prep`
  skill (type-scoped), a "New Event" create-intent, and an onCreate hook that
  shells `meet42 snapshot` to write meeting.json. All privileged calendar/audio
  work lives in the standalone meet42 tool (github.com/Work42-Ai/meet42), which this
  plugin's skills install from its signed releases; this plugin is UI + orchestration.
author: work42
sdk_version: 3.0.0
requires: []
global_skills: meet42-setup
notification_types:
  - id: meeting-detected
    title: Meeting detected
    interactive: true
